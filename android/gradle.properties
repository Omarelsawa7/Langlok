org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G
android.useAndroidX=true
android.enableJetifier=true

# Newer Flutter stable builds pull in Android Gradle Plugin 9+, which
# defaults to a new DSL and built-in Kotlin handling that is incompatible
# with the classic build.gradle.kts syntax used in this project. These
# flags opt back into the AGP 8.x-compatible behavior. See:
# https://developer.android.com/build/releases/agp-9-0-0-release-notes
android.newDsl=false
android.builtInKotlin=false
