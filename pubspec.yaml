name: langtok
description: Offline vertical short-form video player for language learning.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- Video Engine ---
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5      # Bundles native libmpv libs for all platforms

  # --- Storage & Picker ---
  file_picker: ^8.1.2
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.2
  sqflite: ^2.4.1              # Structured local DB: vocabulary bank, progress, favorites
  path: ^1.9.0

  # --- State Management ---
  provider: ^6.1.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
